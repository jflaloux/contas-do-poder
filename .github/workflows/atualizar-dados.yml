# Robô de atualização do Contas do Poder.
# Toda semana ele baixa os dados oficiais da Câmara e do Senado, monta a base, confere com os
# sites oficiais e, se estiver tudo certo, salva os números novos neste repositório.
# Roda nos EUA: as fontes que só abrem do Brasil ficam para a rodada do Brasil (rotina/semana-brasil.sh, terça à tarde);
# coleta/onde.py diz quem roda o quê, e dados/processados/situacao.md mostra a situação de cada fonte.
# O Cloudflare Pages publica o site sozinho a cada mudança no repositório.
# Se a conferência (ou o padronizar, ou o site) falhar, nada é salvo, o trabalho da coleta fica num artefato e a rodada pode ser
# retomada em minutos ("retomar" + run_id no Run workflow). Se a conferência falhar, nada é salvo: o site anterior continua no ar e o GitHub manda um e-mail avisando.
#
# Cada etapa da coleta roda num passo próprio, por rotina/etapa-github.sh, com tempo máximo: a etapa que demora
# demais para sozinha, grava o que já pegou e a rodada segue (o resto é lido na próxima, os robôs retomam de onde
# pararam). Assim uma fonte lenta não impede de conferir e salvar o que as outras trouxeram. Em 06/10/2026 a rodada
# única ("coletar.py tudo") passou das 2h30 do limite e foi cancelada sem salvar nada. O prazo geral é PRAZO_FIM;
# os últimos RESERVA_MIN (70) minutos dele são para padronizar, montar o site, conferir e salvar (rotina/etapa-github.sh).

name: Atualizar dados

on:
  schedule:
    # Toda terça-feira às 8h17 de Brasília (11h17 UTC).
    # Semanal, e não mensal, porque o GitHub apaga o cache de downloads que fica 7 dias sem uso.
    - cron: "17 11 * * 2"
  workflow_dispatch: # botão "Run workflow", para rodar na hora
    inputs:
      retomar:
        description: "Retomar uma rodada que não salvou: restaura o trabalho dela e roda só padronizar, site, conferência e salvar"
        type: boolean
        default: false
      run_id:
        description: "Com retomar: o número da rodada que não salvou (está no resumo dela e na URL da execução)"
        type: string
        default: ""

permissions:
  contents: write
  actions: read   # baixar o artefato de outra rodada (retomar)
  issues: write   # abrir a issue quando duas rodadas seguidas não salvam

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

env:
  CONTAS_ONDE: exterior
  RETOMAR: ${{ inputs.retomar && 'true' || 'false' }}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # o máximo do GitHub é 360; o orçamento da rodada está em rotina/etapa-github.sh
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar as dependências
        run: |
          sudo apt-get install -y poppler-utils  # pdftotext, para as folhas em PDF da Câmara de Maceió
          pip install -r requirements.txt

      - name: Testes rápidos do código (param a rodada antes de 2 horas de coleta)
        run: |
          python -m coleta.testes_pandas
          python -m coleta.testes_gravacao
          python -m coleta.testes_disjuntor

      - name: Recuperar os downloads da semana passada
        uses: actions/cache/restore@v4
        with:
          path: dados/cache
          key: downloads-${{ github.run_id }}
          restore-keys: downloads-

      - name: Retomar - baixar o trabalho da rodada que não salvou
        if: ${{ inputs.retomar }}
        uses: actions/download-artifact@v4
        with:
          name: trabalho-da-rodada
          path: ${{ runner.temp }}/retomada
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Retomar - restaurar o trabalho (recusa se a main mudou os mesmos arquivos)
        if: ${{ inputs.retomar }}
        run: |
          chmod +x rotina/*.sh
          rotina/retomar-trabalho.sh "$RUNNER_TEMP/retomada"

      - name: Conferir que a legislatura não terminou
        run: |
          # coletar.py recusa Câmara, Senado e Executivo (código 5) depois do fim da legislatura; aqui isso para a rodada
          # antes de coletar e de salvar, e não passa por um passo que só avisa
          python - <<'PYEOF'
          import sys
          from coleta.config import FIM_LEGISLATURA, LEGISLATURA, LEGISLATURA_ENCERRADA
          if LEGISLATURA_ENCERRADA:
              print(f"A legislatura {LEGISLATURA} terminou em {FIM_LEGISLATURA[1]:02d}/{FIM_LEGISLATURA[0]}. Atualize coleta/config.py.")
              sys.exit(5)
          PYEOF

      - name: Marcar o prazo da coleta
        run: |
          echo "PRAZO_FIM=$(( $(date +%s) + 325 * 60 ))" >> "$GITHUB_ENV"
          chmod +x rotina/etapa-github.sh

      - name: "Coletar: Câmara dos Deputados"
        run: rotina/etapa-github.sh camara 130

      - name: "Coletar: Senado"
        run: rotina/etapa-github.sh senado 15

      - name: "Coletar: Presidente, vice e ministros"
        run: rotina/etapa-github.sh executivo 15

      - name: "Coletar: Judiciário"
        run: rotina/etapa-github.sh judiciario 20

      - name: "Coletar: Câmaras municipais: custo e vereadores eleitos"
        run: rotina/etapa-github.sh municipios 15

      - name: "Coletar: Renda (PNAD)"
        run: rotina/etapa-github.sh renda 45

      - name: "Coletar: Presença e projetos (Câmara e Senado)"
        run: rotina/etapa-github.sh atividade 40

      - name: "Coletar: Vereadores das capitais"
        run: rotina/etapa-github.sh vereadores 40

      - name: "Coletar: Prefeituras das capitais"
        run: rotina/etapa-github.sh prefeituras 30

      - name: "Coletar: Governadores e vices"
        run: rotina/etapa-github.sh governadores 40

      - name: "Coletar: Assembleias Legislativas"
        run: rotina/etapa-github.sh assembleias 70

      - name: "Coletar: Índice de Transparência"
        run: rotina/etapa-github.sh indice 10

      - name: "Coletar: Tribunais de Contas"
        run: rotina/etapa-github.sh tce 90

      - name: "Coletar: Juntar tudo na base unificada"
        run: rotina/etapa-github.sh padronizar 30 essencial

      - name: "Coletar: Fotos"
        run: rotina/etapa-github.sh fotos 30

      - name: "Coletar: Bens declarados ao TSE"
        run: rotina/etapa-github.sh bens 30

      - name: "Coletar: Gerar os arquivos do site"
        run: rotina/etapa-github.sh site 15 essencial

      - name: "Coletar: Situação das fontes"
        run: rotina/etapa-github.sh situacao 5 essencial

      - name: Guardar os downloads para a próxima vez
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dados/cache
          key: downloads-${{ github.run_id }}

      - name: Conferir com os sites oficiais (trava se algo estiver errado)
        id: conferir
        run: |
          # o motivo de não salvar vai para o resumo (rotina/avisar-rodada.sh)
          falhou() { echo "$1" | tee "$RUNNER_TEMP/motivo.txt"; exit 1; }
          # sem a base unificada e os arquivos do site, não há o que conferir nem salvar
          if grep -Eq '^(padronizar|site) ([1-9][0-9]*) | 5 [0-9]+$' "$RUNNER_TEMP/etapas.txt"; then
            falhou "$(grep -E '^(padronizar|site) [1-9]|^[a-z]+ 5 ' "$RUNNER_TEMP/etapas.txt" | head -3 | tr '\n' ';') padronizar ou gerar o site falhou, ou uma etapa recusou rodar (código 5, fim da legislatura)"
          fi
          # mais de 3 etapas com erro de verdade: algo sistêmico (rede, código); não se salva nada
          COM_ERRO=$(awk '$2 !~ /^(0|3|124)$/ && $2 != "pulada-por-tempo"' "$RUNNER_TEMP/etapas.txt" | wc -l)
          if [ "$COM_ERRO" -gt 3 ]; then
            falhou "$COM_ERRO etapas terminaram com erro: algo está errado com a rodada, nada será salvo"
          fi
          python coletar.py conferir --max-alertas 8 || falhou "a conferência com os sites oficiais passou do limite de alertas (veja dados/processados/conferencia.md, anexado à execução)"

      - name: Situação das fontes (no resumo desta execução)
        if: always()
        run: cat dados/processados/situacao.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Salvar os números novos no repositório
        id: salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/processados dados/portal_transparencia dados/municipios dados/municipios_tce dados/judiciario dados/governadores dados/camara dados/atividade dados/bens dados/assembleias dados/referencia/renda_trabalho.json site/dados site/fotos
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última atualização."
            touch "$RUNNER_TEMP/salvo"
            exit 0
          fi
          git commit -m "Atualização dos dados: $(date -u +%d/%m/%Y)"
          for tentativa in 1 2 3; do
            if ! git pull --rebase; then
              # conflito com a rodada do Brasil: só nos arquivos do site gerados a partir dos CSVs. Fica a versão de lá
              # e os arquivos são refeitos com os CSVs das duas rodadas
              CONFLITOS=$(git diff --name-only --diff-filter=U)
              if echo "$CONFLITOS" | grep -qvE '^(site/dados/|site/fotos/creditos.json|dados/processados/)'; then
                echo "Conflito fora dos arquivos gerados: $CONFLITOS"; git rebase --abort; exit 1
              fi
              echo "$CONFLITOS" | xargs git checkout --ours --
              echo "$CONFLITOS" | xargs git add --
              GIT_EDITOR=true git rebase --continue
              python coletar.py montar || { echo "Os arquivos do site não foram refeitos depois do rebase: nada será enviado." | tee "$RUNNER_TEMP/motivo.txt"; exit 1; }
              git add dados/processados site/dados site/fotos
              git diff --cached --quiet || git commit -m "Arquivos do site refeitos depois das duas rodadas"
            fi
            # a árvore que vai ser enviada (depois do rebase e do montar) passa de novo pela conferência
            python coletar.py conferir --max-alertas 8 || { echo "A conferência da árvore final (depois de trazer o que a rodada do Brasil enviou) falhou: nada será enviado." | tee "$RUNNER_TEMP/motivo.txt"; exit 1; }
            git push && { touch "$RUNNER_TEMP/salvo"; exit 0; }
            echo "Push recusado (tentativa $tentativa): outra rodada enviou antes; trazendo o que ela enviou."
          done
          echo "O push não saiu depois de 3 tentativas." | tee "$RUNNER_TEMP/motivo.txt"; exit 1

      - name: Guardar o relatório da conferência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia
          path: dados/processados/conferencia.md
          if-no-files-found: ignore

      - name: Guardar o trabalho da coleta (só se a rodada não salvou)
        if: always()
        run: |
          chmod +x rotina/*.sh
          rotina/guardar-trabalho.sh

      - name: Enviar o trabalho da coleta como artefato (14 dias; nunca vai para a main)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trabalho-da-rodada
          path: ${{ runner.temp }}/trabalho
          retention-days: 14
          if-no-files-found: ignore

      - name: Resumo e aviso (diz por que nada foi salvo e como retomar)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: rotina/avisar-rodada.sh

      - name: Avisar das etapas que deram erro (depois de salvar)
        if: always()
        run: |
          # as etapas não derrubam a rodada (para que o resto seja salvo), mas um erro de verdade (diferente de "acabou o
          # tempo") faz esta rodada terminar com erro, e o GitHub manda o e-mail
          {
            echo "### Etapas da coleta"
            echo '```'
            awk '{ printf "%-14s código %-4s %s min\n", $1, $2, int($3 / 60) }' "$RUNNER_TEMP/etapas.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          if awk '$2 !~ /^(0|3|124)$/ && $2 != "pulada-por-tempo" { achou = 1 } END { exit !achou }' "$RUNNER_TEMP/etapas.txt"; then
            echo "Etapas com erro:"
            awk '$2 !~ /^(0|3|124)$/ && $2 != "pulada-por-tempo"' "$RUNNER_TEMP/etapas.txt"
            exit 1
          fi
          # fontes que falharam nesta rodada (as etapas absorvem o erro de cada fonte para as outras seguirem): aparecem
          # no resumo, e 3 falhas seguidas da mesma fonte fazem a execução terminar com erro
          python - <<'PYEOF'
          import json, os, sys
          try:
              d = json.load(open("dados/processados/coletas_exterior.json"))
          except (OSError, ValueError):
              sys.exit(0)
          f = {k: v for k, v in d.items() if v.get("falhas")}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as r:
              r.write("### Fontes com falha desta rodada\n" + "".join(f"- {k}: {v['falhas']} seguida(s): {v.get('ultimo_erro', '')[:120]}\n" for k, v in sorted(f.items())))
          graves = [k for k, v in f.items() if v["falhas"] >= 3]
          if graves:
              print("Fontes com 3 falhas seguidas ou mais:", ", ".join(graves))
              sys.exit(1)
          PYEOF
